\* Restricted cross-protocol response-fault slice; asymmetric CHOOSE actors.
\* Not unrestricted packet loss, liveness, physical power-loss, or C++ refinement.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 3
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION CrossReplySpec
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
\* Expected TLC exit 12 only when both explicit fault actions occur.
INVARIANT NoCrossReplyVoteDupAppendDupWitness
