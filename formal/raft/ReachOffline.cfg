\* EXPECTED counterexample: a node must be able to crash offline.
\* Narrow core-safety profile: no crash/dup/drop and one in-flight AE per peer.
\* All safety invariants remain enabled. Not a substitute for full Spec.
\* Bounded safety run. All Mut* must be FALSE here.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 1
  MaxLogLen = 1
  MaxMsgs = 2
  MaxEpoch = 1
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION RecoverySpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry
INVARIANT NoOfflineWitness
CHECK_DEADLOCK FALSE
