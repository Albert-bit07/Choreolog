\* Deliberately asymmetric two-term/one-entry combined safety slice.
\* CHOOSE-designated primary/successor make SYMMETRY invalid here.
\* This is NOT the unrestricted asynchronous model or a refinement proof.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 2
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION CombinedSpec
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
INVARIANT NoCombinedHandoffWitness
