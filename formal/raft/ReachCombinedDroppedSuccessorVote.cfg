  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 3
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION CombinedVoteFaultSpec
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
INVARIANT NoCombinedDroppedSuccessorVoteWitness
