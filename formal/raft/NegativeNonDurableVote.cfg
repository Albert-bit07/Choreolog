\* EXPECTED violation: a crashed voter must not vote twice in one term.
\* Two election terms, crashes, delayed/lost vote messages; no client log writes.
\* Narrow core-safety profile: no crash/dup/drop and one in-flight AE per peer.
\* All safety invariants remain enabled. Not a substitute for full Spec.
\* Bounded safety run. All Mut* must be FALSE here.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 2
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = TRUE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION ElectionSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry
INVARIANT ElectionSafety
CHECK_DEADLOCK FALSE
