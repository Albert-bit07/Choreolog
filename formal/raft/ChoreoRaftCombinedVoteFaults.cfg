\* Three-message bound for restricted election vote drops/duplicates.
\* CHOOSE-designated primary/successor make SYMMETRY invalid here.
\* Same three-server, two-term, one-entry limits and invariants as ChoreoRaftCombined.cfg. 
\* This is NOT unrestricted network fault coverage or a refinement proof.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 3
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION CombinedVoteFaultSpec
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PendingSynced
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT CommittedUnique
INVARIANT LeaderCompleteness
INVARIANT CommittedNeverLost
INVARIANT CommitKnowledgeSound
INVARIANT StateMachineSafety
INVARIANT MatchIndexSound
PROPERTY DurableMonotone
PROPERTY AppliedNeverShrinks
