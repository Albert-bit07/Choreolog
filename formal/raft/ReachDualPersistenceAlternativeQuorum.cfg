\* Restricted, asymmetric three-node/two-term/one-entry fault sequence.
\* CHOOSE-designated actors make symmetry invalid.
\* Each failed write selects the old-disk outcome of Torn, not all outcomes.
\* This is not unrestricted safety, liveness, or implementation refinement.
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 1
  MaxMsgs = 2
  MaxEpoch = 2
  MutTruncateOnShorter = FALSE
  MutCommitOldTerm = FALSE
  MutVoteNotDurable = FALSE
  MutIgnoreEpoch = FALSE
  Follower = Follower
  Candidate = Candidate
  Leader = Leader
  Nil = Nil
SPECIFICATION DualFaultSpec
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
INVARIANT NoDualFailureAlternativeQuorumWitness
