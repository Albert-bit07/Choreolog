name: Format PR11 latest fixture once
on:
  push:
    branches: ['raft/model-conformance-v1']
    paths: ['.github/workflows/raft-pr11-format2-once.yml']
permissions:
  contents: write
jobs:
  format-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raft/model-conformance-v1
          persist-credentials: true
      - name: Format Raft scenario source
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/tests/integration/raft_conformance_scenarios.cpp
          if ! git diff --quiet -- cpp-runtime/tests/integration/raft_conformance_scenarios.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime/tests/integration/raft_conformance_scenarios.cpp
            git commit -m 'style: format added Raft log repair scenario'
            git push origin HEAD:raft/model-conformance-v1
          fi
