name: Format PR10 core once
on:
  push:
    branches: ['raft/pure-transition-core-v1']
    paths: ['.github/workflows/raft-core-format-once.yml']
permissions:
  contents: write
jobs:
  format-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raft/pure-transition-core-v1
          persist-credentials: true
      - name: Format newly added C++ files
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/include/choreoos/raft/transition.hpp cpp-runtime/src/raft/transition.cpp cpp-runtime/tests/unit/raft_transition_test.cpp
          if ! git diff --quiet -- cpp-runtime/include/choreoos/raft/transition.hpp cpp-runtime/src/raft/transition.cpp cpp-runtime/tests/unit/raft_transition_test.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime/include/choreoos/raft/transition.hpp cpp-runtime/src/raft/transition.cpp cpp-runtime/tests/unit/raft_transition_test.cpp
            git commit -m 'style: format Raft transition core using CI clang-format'
            git push origin HEAD:raft/pure-transition-core-v1
          fi
