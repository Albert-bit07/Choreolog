name: Format PR13 event bridge once
on:
  push:
    branches: ['raft/event-wal-projection-v1']
    paths: ['.github/workflows/raft-domain-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raft/event-wal-projection-v1
          persist-credentials: true
      - name: Format new Raft domain code and tests
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/include/choreoos/raft/domain_bridge.hpp cpp-runtime/src/raft/domain_bridge.cpp cpp-runtime/tests/unit/raft_domain_bridge_test.cpp
          if ! git diff --quiet -- cpp-runtime/include/choreoos/raft/domain_bridge.hpp cpp-runtime/src/raft/domain_bridge.cpp cpp-runtime/tests/unit/raft_domain_bridge_test.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime/include/choreoos/raft/domain_bridge.hpp cpp-runtime/src/raft/domain_bridge.cpp cpp-runtime/tests/unit/raft_domain_bridge_test.cpp
            git commit -m 'style: clang-format typed Raft WAL projection'
            git push origin HEAD:raft/event-wal-projection-v1
          fi
