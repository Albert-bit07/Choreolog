name: Raft model checking

on:
  push:
    paths:
      - 'formal/raft/**'
      - '.github/workflows/raft-model.yml'
      - 'scripts/export_tlc_trace.py'
      - 'scripts/tlc_witness_prefix.py'
      - 'scripts/tests/test_export_tlc_trace.py'
      - 'scripts/tests/test_tlc_witness_prefix.py'
      - 'scripts/tests/test_combined_tlc_witness.py'
      - 'scripts/tests/test_tlc_dual_fault_witness.py'
  pull_request:
    paths:
      - 'formal/raft/**'
      - '.github/workflows/raft-model.yml'
      - 'scripts/export_tlc_trace.py'
      - 'scripts/tlc_witness_prefix.py'
      - 'scripts/tests/test_export_tlc_trace.py'
      - 'scripts/tests/test_tlc_witness_prefix.py'
      - 'scripts/tests/test_combined_tlc_witness.py'
      - 'scripts/tests/test_tlc_dual_fault_witness.py'

permissions:
  contents: read

jobs:
  election-tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned TLC and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum --check

      - name: Model-check three-node elections
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 300s java -Xmx3g -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config Election.cfg -workers 2 Election.tla

      - name: Model-check two-term restart and stale-message paths
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ElectionTwoTerms.cfg -workers 2 Election.tla

      - name: Model-check bounded Raft replication and commit safety
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config Replication.cfg -workers 2 Replication.tla

      - name: Check core election-to-commit safety (exhaustive)
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCore.cfg -workers 2 ChoreoRaft.tla

      - name: Check crash-restart and torn-write safety (scoped)
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 180s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftRecovery.cfg -workers 2 ChoreoRaft.tla

      - name: Check two-term durable elections and restart safety
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 150s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftTwoTermElection.cfg -workers 2 ChoreoRaft.tla

      - name: Check bounded combined two-term replication and faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombined.cfg -workers 2 ChoreoRaft.tla

      - name: Check combined two-term safety with three queued messages
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombinedThreeMessages.cfg -workers 2 ChoreoRaft.tla

      - name: Check ordered two-node persistence-failure safety
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftDualPersistenceFaults.cfg -workers 2 ChoreoRaftDualPersistenceFaults.tla

      - name: Require both failed writes and third-peer quorum in one TLC behavior
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ReachDualPersistenceAlternativeQuorum.cfg -workers 2 ChoreoRaftDualPersistenceFaults.tla \
            > "$RUNNER_TEMP/dual-persistence-alternative-quorum.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/dual-persistence-alternative-quorum.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq \
            'Invariant NoDualFailureAlternativeQuorumWitness is violated' \
            "$RUNNER_TEMP/dual-persistence-alternative-quorum.txt"; then
            echo "::error::Ordered two-failure quorum witness missing; TLC exit code $result"
            exit 1
          fi

      - name: Export and validate typed dual-fault TLC behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export_tlc_trace.py \
            --log "$RUNNER_TEMP/dual-persistence-alternative-quorum.txt" \
            --model formal/raft/ChoreoRaftDualPersistenceFaults.tla \
            --config formal/raft/ReachDualPersistenceAlternativeQuorum.cfg \
            --invariant NoDualFailureAlternativeQuorumWitness \
            --output "$RUNNER_TEMP/dual-persistence-typed.json"
          python3 scripts/tests/test_tlc_dual_fault_witness.py \
            --witness "$RUNNER_TEMP/dual-persistence-typed.json" \
            --model formal/raft/ChoreoRaftDualPersistenceFaults.tla \
            --config formal/raft/ReachDualPersistenceAlternativeQuorum.cfg \
            --log "$RUNNER_TEMP/dual-persistence-alternative-quorum.txt"

      - name: Preserve bounded dual-persistence TLC witness
        uses: actions/upload-artifact@v4
        with:
          name: tlc-dual-persistence-fault-witness
          path: ${{ runner.temp }}/dual-persistence-alternative-quorum.txt
          if-no-files-found: error

      - name: Check bounded combined vote-message faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombinedVoteFaults.cfg -workers 2 ChoreoRaftVoteFaults.tla

      - name: Require duplicate and both vote-drop fault witnesses
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for spec in \
            "ReachCombinedDuplicatedVote.cfg:NoCombinedDuplicatedVoteWitness" \
            "ReachCombinedDroppedThirdVote.cfg:NoCombinedDroppedThirdVoteWitness" \
            "ReachCombinedDroppedSuccessorVote.cfg:NoCombinedDroppedSuccessorVoteWitness"; do
            IFS=: read -r cfg invariant <<< "$spec"
            set +e
            timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "$cfg" -workers 2 ChoreoRaftVoteFaults.tla \
              > "$RUNNER_TEMP/$cfg.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$cfg.log"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant $invariant is violated" "$RUNNER_TEMP/$cfg.log"; then
              echo "::error::Required bounded fault witness $invariant missing; TLC exit code $result"
              exit 1
            fi
          done

      - name: Check bounded combined AppendEntries-request faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombinedAppendFaults.cfg -workers 2 ChoreoRaftAppendFaults.tla

      - name: Require actual AppendEntries drop and duplicate actions
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for spec in \
            "ReachCombinedAppendDrop.cfg:NoCombinedAppendDropWitness" \
            "ReachCombinedAppendDuplicate.cfg:NoCombinedAppendDuplicateWitness"; do
            IFS=: read -r cfg invariant <<< "$spec"
            set +e
            timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "$cfg" -workers 2 ChoreoRaftAppendFaults.tla \
              > "$RUNNER_TEMP/$cfg.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$cfg.log"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant $invariant is violated" "$RUNNER_TEMP/$cfg.log"; then
              echo "::error::Required explicit AppendEntries fault witness $invariant missing; TLC exit code $result"
              exit 1
            fi
          done

      - name: Check bounded combined RequestVote-response faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombinedVoteReplyFaults.cfg -workers 2 ChoreoRaftVoteReplyFaults.tla

      - name: Require actual RequestVote-response drop and duplicate actions
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for spec in \
            "ReachCombinedVoteReplyDrop.cfg:NoCombinedVoteReplyDropWitness" \
            "ReachCombinedVoteReplyDuplicate.cfg:NoCombinedVoteReplyDuplicateWitness"; do
            IFS=: read -r cfg invariant <<< "$spec"
            set +e
            timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "$cfg" -workers 2 ChoreoRaftVoteReplyFaults.tla \
              > "$RUNNER_TEMP/$cfg.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$cfg.log"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant $invariant is violated" "$RUNNER_TEMP/$cfg.log"; then
              echo "::error::Required explicit RequestVote-response fault witness $invariant missing; TLC exit code $result"
              exit 1
            fi
          done

      - name: Check bounded combined AppendEntries-response faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCombinedAppendReplyFaults.cfg -workers 2 ChoreoRaftAppendReplyFaults.tla

      - name: Require actual AppendEntries-response drop and duplicate actions
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for spec in \
            "ReachCombinedAppendReplyDrop.cfg:NoCombinedAppendReplyDropWitness" \
            "ReachCombinedAppendReplyDuplicate.cfg:NoCombinedAppendReplyDuplicateWitness"; do
            IFS=: read -r cfg invariant <<< "$spec"
            set +e
            timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "$cfg" -workers 2 ChoreoRaftAppendReplyFaults.tla \
              > "$RUNNER_TEMP/$cfg.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$cfg.log"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant $invariant is violated" "$RUNNER_TEMP/$cfg.log"; then
              echo "::error::Required explicit AppendEntries-response fault witness $invariant missing; TLC exit code $result"
              exit 1
            fi
          done

      - name: Check bounded mixed RequestVote/AppendEntries response faults
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          timeout 240s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ChoreoRaftCrossReplyFaults.cfg -workers 2 ChoreoRaftCrossReplyFaults.tla

      - name: Require mixed response faults in the same TLC behavior
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for spec in \
            "ReachCrossReplyVoteDupAppendDrop.cfg:NoCrossReplyVoteDupAppendDropWitness" \
            "ReachCrossReplyVoteDupAppendDup.cfg:NoCrossReplyVoteDupAppendDupWitness"; do
            IFS=: read -r cfg invariant <<< "$spec"
            set +e
            timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "$cfg" -workers 2 ChoreoRaftCrossReplyFaults.tla \
              > "$RUNNER_TEMP/$cfg.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$cfg.log"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant $invariant is violated" "$RUNNER_TEMP/$cfg.log"; then
              echo "::error::Required same-behavior cross-reply fault witness $invariant missing; TLC exit code $result"
              exit 1
            fi
          done

      - name: Require committed-entry higher-term handoff witness
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ReachCombinedHandoff.cfg -workers 2 ChoreoRaft.tla \
            > "$RUNNER_TEMP/combined-handoff.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/combined-handoff.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq 'Invariant NoCombinedHandoffWitness is violated' "$RUNNER_TEMP/combined-handoff.txt"; then
            echo "::error::Combined handoff witness missing; TLC exit code $result"
            exit 1
          fi

      - name: Require applied-entry post-handoff crash witness
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ReachCombinedCrashAfterApply.cfg -workers 2 ChoreoRaft.tla \
            > "$RUNNER_TEMP/combined-crash.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/combined-crash.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq 'Invariant NoCombinedCrashAfterApplyWitness is violated' "$RUNNER_TEMP/combined-crash.txt"; then
            echo "::error::Combined applied-entry crash witness missing; TLC exit code $result"
            exit 1
          fi

      - name: Verify leadership changes across terms
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 60s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ReachTwoLeadersDifferentTerms.cfg -workers 2 ChoreoRaft.tla \
            > "$RUNNER_TEMP/two-term-witness.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/two-term-witness.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq 'Invariant NoDifferentTermLeadersWitness is violated' "$RUNNER_TEMP/two-term-witness.txt"; then
            echo "::error::Two-term leadership witness missing; TLC exit code $result"
            exit 1
          fi

      - name: Verify non-durable vote mutation is rejected
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 90s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config NegativeNonDurableVote.cfg -workers 2 ChoreoRaft.tla \
            > "$RUNNER_TEMP/negative-vote.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/negative-vote.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq 'Invariant ElectionSafety is violated' "$RUNNER_TEMP/negative-vote.txt"; then
            echo "::error::Non-durable vote mutation was not detected; TLC exit code $result"
            exit 1
          fi

      - name: Verify protocol milestone reachability
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          for name in Leader Replication Commit Application; do
            echo "Checking witness: ${name}"
            set +e
            timeout 90s java -Xmx3g -jar "$RUNNER_TEMP/tla2tools.jar" \
              -config "Reach${name}.cfg" -workers 2 ChoreoRaft.tla \
              > "$RUNNER_TEMP/witness-${name}.txt" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/witness-${name}.txt"
            if [[ $result -ne 12 ]] || ! grep -Fq "Invariant No${name}Witness is violated" "$RUNNER_TEMP/witness-${name}.txt"; then
              echo "::error::Missing ${name} witness; TLC exit code $result"
              exit 1
            fi
          done

      - name: Verify node-offline reachability
        shell: bash
        working-directory: formal/raft
        run: |
          set -euo pipefail
          set +e
          timeout 45s java -Xmx3g -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -config ReachOffline.cfg -workers 2 ChoreoRaft.tla \
            > "$RUNNER_TEMP/reach-offline.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/reach-offline.txt"
          if [[ $result -ne 12 ]] || ! grep -Fq 'Invariant NoOfflineWitness is violated' "$RUNNER_TEMP/reach-offline.txt"; then
            echo "::error::No offline crash state reached; TLC exit code $result"
            exit 1
          fi

      - name: Export full model-generated witness behaviors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tlc-behaviors"
          for witness in \
            'NoDifferentTermLeadersWitness:ReachTwoLeadersDifferentTerms.cfg:two-term-witness.txt' \
            'ElectionSafety:NegativeNonDurableVote.cfg:negative-vote.txt' \
            'NoLeaderWitness:ReachLeader.cfg:witness-Leader.txt' \
            'NoReplicationWitness:ReachReplication.cfg:witness-Replication.txt' \
            'NoCommitWitness:ReachCommit.cfg:witness-Commit.txt' \
            'NoApplicationWitness:ReachApplication.cfg:witness-Application.txt' \
            'NoOfflineWitness:ReachOffline.cfg:reach-offline.txt' \
            'NoCombinedHandoffWitness:ReachCombinedHandoff.cfg:combined-handoff.txt' \
            'NoCombinedCrashAfterApplyWitness:ReachCombinedCrashAfterApply.cfg:combined-crash.txt'; do
            IFS=: read -r invariant config log <<< "$witness"
            python3 scripts/export_tlc_trace.py \
              --log "$RUNNER_TEMP/$log" \
              --model formal/raft/ChoreoRaft.tla \
              --config "formal/raft/$config" --invariant "$invariant" \
              --output "$RUNNER_TEMP/tlc-behaviors/$config.json"
          done

      - name: Validate combined typed witness semantics and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_combined_tlc_witness.py \
            --model formal/raft/ChoreoRaft.tla \
            --handoff-config formal/raft/ReachCombinedHandoff.cfg \
            --crash-config formal/raft/ReachCombinedCrashAfterApply.cfg \
            --handoff "$RUNNER_TEMP/tlc-behaviors/ReachCombinedHandoff.cfg.json" \
            --crash "$RUNNER_TEMP/tlc-behaviors/ReachCombinedCrashAfterApply.cfg.json"

      - name: Preserve model-generated behaviors for replay work
        uses: actions/upload-artifact@v4
        with:
          name: tlc-witness-behaviors
          path: ${{ runner.temp }}/tlc-behaviors/*.json
          if-no-files-found: error
