name: Temporary format ChoreoOS API branch
on:
  push:
    branches:
      - feat/partition-safety-management-api-20261012
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format C++ sources
        shell: bash
        run: |
          set -euo pipefail
          find cpp-runtime -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 |
            xargs -0 -r clang-format -i
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cpp-runtime
            git commit -m "style: format compact receipt and management API changes"
            git push origin HEAD:feat/partition-safety-management-api-20261012
          fi
