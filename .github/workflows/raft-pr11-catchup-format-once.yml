name: Format PR11 catch-up fixture once
on:
  push:
    branches: ['raft/model-conformance-v1']
    paths: ['.github/workflows/raft-pr11-catchup-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raft/model-conformance-v1
          persist-credentials: true
      - name: Format catch-up regression test
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/tests/unit/catchup_test.cpp
          if ! git diff --quiet -- cpp-runtime/tests/unit/catchup_test.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime/tests/unit/catchup_test.cpp
            git commit -m 'style: clang-format optimized Windows catch-up test'
            git push origin HEAD:raft/model-conformance-v1
          fi
