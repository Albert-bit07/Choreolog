name: One-time consensus hardening formatter
on:
  push:
    branches: ['hardening/consensus-fail-closed-v1']
    paths: ['.github/workflows/consensus-hardening-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/consensus-fail-closed-v1
          persist-credentials: true
      - name: Format modified C++ source
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/include/choreoos/state/store.hpp cpp-runtime/src/state/store.cpp cpp-runtime/include/choreoos/replication/replica.hpp cpp-runtime/src/replication/replica.cpp cpp-runtime/src/network/node_server.cpp cpp-runtime/tests/unit/consensus_hardening_test.cpp
          if ! git diff --quiet -- cpp-runtime; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime
            git commit -m 'style: clang-format consensus safety hardening'
            git push origin HEAD:hardening/consensus-fail-closed-v1
          fi
