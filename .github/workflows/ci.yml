name: CI

on:
  push:
  pull_request:

# One in-flight run per branch. A new push cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same vcpkg revision as vcpkg.json builtin-baseline. Clone HEAD would
  # pick up registry changes that the manifest never reviewed.
  VCPKG_COMMIT: 6e856794aebd1ee877acb74c9264d9552903c6fe

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find cpp-runtime -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0)
          clang-format --dry-run --Werror "${files[@]}"

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" init
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout FETCH_HEAD
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          # vcvars overwrites VCPKG_ROOT with Visual Studio's copy.
          echo "CHOREOOS_VCPKG=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # Ninja on windows-latest otherwise finds MinGW first. vcpkg's
      # x64-windows GoogleTest is built with MSVC, so the test binary must
      # be compiled with cl or the testing:: symbols never resolve.
      - name: Enter MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          export VCPKG_ROOT="$CHOREOOS_VCPKG"
          args=(-S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            args+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
            ninja_path="$(command -v ninja || true)"
            if [[ -n "$ninja_path" ]]; then
              args+=(-DCMAKE_MAKE_PROGRAM="$ninja_path")
            fi
          fi
          args+=(
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DCHOREOOS_BUILD_TESTS=ON
            -DCHOREOOS_WARNINGS_AS_ERRORS=ON
          )
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --timeout 240


  management-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install gRPC and protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev protobuf-compiler-grpc \
            protobuf-compiler libprotobuf-dev

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" init
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure gRPC gateway
        shell: bash
        run: |
          cmake -S . -B build/management -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCHOREOOS_BUILD_MANAGEMENT_API=ON \
            -DCHOREOOS_BUILD_TESTS=OFF \
            -DCHOREOOS_BUILD_BENCHMARKS=OFF \
            -DCHOREOOS_WARNINGS_AS_ERRORS=ON

      - name: Build gRPC gateway
        run: cmake --build build/management --target choreoos-management choreoos-node

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build generated C# gRPC client
        run: dotnet build dotnet-dashboard/src/ChoreoOS.Client/ChoreoOS.Client.csproj --configuration Release
      
      - name: Smoke-test C# gRPC management calls against C++ node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/choreoos-management-node"
          cat > "$RUNNER_TEMP/management-node.yaml" <<EOF
          id: node-1
          leader: node-1
          data: $RUNNER_TEMP/choreoos-management-node
          listen: 127.0.0.1:19401
          elections: false
          EOF
          build/management/cpp-runtime/choreoos-node "$RUNNER_TEMP/management-node.yaml"             >"$RUNNER_TEMP/choreoos-node.log" 2>&1 &
          node_pid=$!
          build/management/cpp-runtime/choreoos-management 19401 19402             >"$RUNNER_TEMP/choreoos-gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'rc=$?; cat "$RUNNER_TEMP/choreoos-node.log"             "$RUNNER_TEMP/choreoos-gateway.log"; kill "$node_pid" "$gateway_pid" 2>/dev/null || true; exit "$rc"' EXIT
          ready=false
          for i in {1..50}; do
            if ( : >/dev/tcp/127.0.0.1/19402 ) 2>/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          test "$ready" = true
          dotnet run --project dotnet-dashboard/tests/ChoreoOS.ClientSmoke/ChoreoOS.ClientSmoke.csproj             --configuration Release -- 19402

      - name: Verify three-node gRPC leader failover and safe retries
        shell: bash
        run: |
          dotnet run --project dotnet-dashboard/tests/ChoreoOS.ClusterSmoke/ChoreoOS.ClusterSmoke.csproj \
            --configuration Release -- \
            "$PWD/build/management/cpp-runtime/choreoos-node" \
            "$PWD/build/management/cpp-runtime/choreoos-management"


  
  api-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 ninja-build

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" init
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure ASan and UBSan
        shell: bash
        run: |
          cmake -S . -B build/api-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCHOREOOS_ENABLE_SANITIZERS=ON \
            -DCHOREOOS_BUILD_TESTS=ON \
            -DCHOREOOS_BUILD_BENCHMARKS=OFF \
            -DCHOREOOS_WARNINGS_AS_ERRORS=ON

      - name: Build with sanitizers and strict warnings
        run: cmake --build build/api-audit --parallel 2

      - name: Run sanitized correctness tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # CatchUpTest's multi-megabyte stress workload remains covered
          # by the normal Linux/Windows jobs; run all other correctness
          # cases under the instrumented binary.
          ctest --test-dir build/api-audit --output-on-failure --timeout 240 \
            -E '^CatchUpTest'

      - name: Static-analyze protocol and cluster runtime
        shell: bash
        run: |
          clang-tidy-18 --version
          clang-tidy-18 -p build/api-audit \
            cpp-runtime/src/protocol/codec.cpp \
            cpp-runtime/src/runtime/config.cpp \
            cpp-runtime/src/network/node_server.cpp \
            --warnings-as-errors='bugprone-*,performance-*'
