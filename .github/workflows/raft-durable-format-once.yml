name: Format PR12 durability files once
on:
  push:
    branches: ['raft/durable-adapter-v1']
    paths: ['.github/workflows/raft-durable-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raft/durable-adapter-v1
          persist-credentials: true
      - name: Format new checkpoint and driver files
        run: |
          set -euo pipefail
          clang-format -i cpp-runtime/include/choreoos/raft/checkpoint.hpp cpp-runtime/include/choreoos/raft/durable_node.hpp cpp-runtime/src/raft/checkpoint.cpp cpp-runtime/src/raft/durable_node.cpp cpp-runtime/tests/unit/raft_durable_test.cpp
          if ! git diff --quiet -- cpp-runtime/include/choreoos/raft/checkpoint.hpp cpp-runtime/include/choreoos/raft/durable_node.hpp cpp-runtime/src/raft/checkpoint.cpp cpp-runtime/src/raft/durable_node.cpp cpp-runtime/tests/unit/raft_durable_test.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cpp-runtime/include/choreoos/raft/checkpoint.hpp cpp-runtime/include/choreoos/raft/durable_node.hpp cpp-runtime/src/raft/checkpoint.cpp cpp-runtime/src/raft/durable_node.cpp cpp-runtime/tests/unit/raft_durable_test.cpp
            git commit -m 'style: clang-format Raft durable checkpoint adapter'
            git push origin HEAD:raft/durable-adapter-v1
          fi
