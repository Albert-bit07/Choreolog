syntax = "proto3";

package choreoos.v1;

// Wire messages for fixed-leader replication.
// Elections are described here so the schema is stable, but Milestone 3 does
// not grant votes. A fixed leader is not consensus.

message Handshake {
  string node_id = 1;
  uint32 major = 2;
  uint32 minor = 3;
}

message LogRecord {
  string canonical = 1;
}

message AppendEntries {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogRecord entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  string follower_id = 2;
  bool success = 3;
  uint64 match_index = 4;
  uint64 hint_index = 5;
}

message RequestVote {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  string voter_id = 2;
  bool vote_granted = 3;
}

message InstallSnapshot {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  string state_hash = 5;
  bytes payload = 6;   // one chunk of the snapshot payload
  uint64 offset = 7;   // where this chunk starts in the whole payload
  bool more = 8;       // another chunk follows; false on the final (or only) chunk
}

message InstallSnapshotResponse {
  uint64 term = 1;
  string follower_id = 2;
  bool success = 3;
  uint64 next_offset = 4;  // offset the follower expects next; 0 asks for a restart
}

message ProtocolError {
  string code = 1;
  string detail = 2;
}

message ClientCommand {
  string canonical = 1;
}

message ClientResponse {
  bool ok = 1;
  bool duplicate = 2;
  string error_code = 3;
  string error_message = 4;
  string leader_id = 5;
  uint64 index = 6;
  string event_canonical = 7;
  string state_hash = 8;
}

message StatusQuery {}

message StatusResponse {
  string node_id = 1;
  string leader_id = 2;
  string role = 3;
  uint64 term = 4;
  uint64 commit_index = 5;
  uint64 last_log_index = 6;
  string state_hash = 7;
  string canonical_state = 8;
}

message ManagementQuery {
  string operation = 1;
  uint64 after_index = 2;
  uint32 page_size = 3;
  string peer_id = 4;
  uint32 delay_ms = 5;
}

message ManagementReply {
  string error_code = 1;
  string error_message = 2;
  repeated string events = 3;
  uint64 next_after_index = 4;
  bool has_more = 5;
  uint64 role_changes = 6;
  uint64 elections_started = 7;
  uint64 votes_granted = 8;
  uint64 step_downs = 9;
  uint64 messages_dropped_oversize = 10;
  uint64 snapshot_chunks_sent = 11;
  uint64 transport_frames_sent = 12;
  uint64 transport_frames_received = 13;
  uint64 transport_dropped = 14;
  uint64 snapshot_index = 15;
  string snapshot_state_hash = 16;
  string recovery_report = 17;
}
