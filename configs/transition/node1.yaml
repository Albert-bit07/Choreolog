# Loopback transition-core cluster; use peer mTLS for remote replication.
id: node-1
leader: node-1
data: node-data/transition-node-1
listen: 127.0.0.1:7201
peers: node-2@127.0.0.1:7202,node-3@127.0.0.1:7203
consensus_engine: transition
elections: true
snapshot_every: 100
heartbeat_ms: 100
election_timeout_min: 6
election_timeout_max: 12
rng_seed: 18
